<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Tailwind CSS -->

    <!-- Lucide Icons -->

    <!-- Google Fonts: Inter (UI) & Noto Naskh Arabic (Quran) -->

    <!-- Konfigurasi Tailwind & Custom Styles -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        arabic: ['Noto Naskh Arabic', 'serif'],
                    },
                    colors: {
                        nu: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669', // Primary Green
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                        }
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(0,0,0,0.08)',
                        'glow': '0 0 20px rgba(16, 185, 129, 0.3)'
                    }
                }
            }
        }
    </script>

    <style>
        /* Smooth Scrolling & Hide Scrollbar */
        body { -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Transitions */
        .view-section { 
            display: none; 
            opacity: 0; 
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .view-section.active { 
            display: flex; 
            opacity: 1; 
            transform: translateY(0);
        }

        /* Glassmorphism Utilities */
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .glass-dark {
            background: rgba(6, 78, 59, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Tasbih Animation */
        .tasbih-ring {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tasbih-btn:active .tasbih-ring { transform: scale(0.90); }
        .tasbih-btn:active { transform: scale(0.98); }

        /* Skeleton Loading */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex justify-center items-start text-gray-800">

    <!-- Mobile Wrapper -->
    <div class="w-full max-w-md bg-white min-h-screen relative shadow-2xl overflow-hidden flex flex-col">

        <!-- ================= VIEW: HOME ================= -->

                <!-- Decorative Background -->
                <div class="absolute top-0 right-0 w-64 h-64 bg-nu-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 -mr-16 -mt-16 animate-pulse"></div>

                        </div>

                    </div>
                    <div class="flex gap-4">

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- CONFIGURATION ---
        // Menggunakan API Aladhan untuk data Kemenag (Method 20)
        const API_URL = "https://api.aladhan.com/v1/timingsByCity?city=Jakarta&country=Indonesia&method=20";
        
        // --- STATE MANAGEMENT ---
        let appData = {
            prayerTimes: null,
            hijriDate: null,
            nextPrayer: null,
            tasbihCount: 0
        };

        // --- MENU DATA ---
        const MENU_ITEMS = [
            { id: 'quran', label: "Al-Qur'an", icon: 'book-open', color: 'text-nu-600', bg: 'bg-nu-50', action: "switchView('view-quran')" },
            { id: 'yasin', label: 'Yasin', icon: 'heart', color: 'text-nu-600', bg: 'bg-nu-50' },
            { id: 'tahlil', label: 'Tahlil', icon: 'users', color: 'text-nu-600', bg: 'bg-nu-50' },
            { id: 'maulid', label: 'Maulid', icon: 'moon', color: 'text-nu-600', bg: 'bg-nu-50' },
            { id: 'tasbih', label: 'Tasbih', icon: 'rotate-ccw', color: 'text-nu-600', bg: 'bg-nu-50', action: "switchView('view-tasbih')" },
            { id: 'ziarah', label: 'Ziarah', icon: 'map-pin', color: 'text-nu-600', bg: 'bg-nu-50' },
            { id: 'zakat', label: 'Zakat', icon: 'wallet', color: 'text-nu-600', bg: 'bg-nu-50' },
            { id: 'lain', label: 'Lainnya', icon: 'grid', color: 'text-gray-400', bg: 'bg-gray-50' },
        ];

        // --- MOCK ARTICLES ---
        const ARTICLES = [
            { cat: "Nasional", title: "PBNU Ajak Masyarakat Jaga Kondusivitas Jelang Pemilu", img: "https://placehold.co/600x400/047857/ffffff?text=PBNU+News", date: "Baru saja" },
            { cat: "Hikmah", title: "Keutamaan Bulan Rajab dan Amalan yang Dianjurkan", img: "https://placehold.co/600x400/059669/ffffff?text=Rajab", date: "1 Jam lalu" },
            { cat: "Bahtsul Masail", title: "Hukum Penggunaan AI dalam Perspektif Fiqih", img: "https://placehold.co/600x400/064e3b/ffffff?text=Fiqih+AI", date: "3 Jam lalu" },
        ];

        const SURAH_DATA = [
            { num: 1, name: "Al-Fatihah", mean: "Pembukaan", type: "Makkiyah", ayat: 7 },
            { num: 2, name: "Al-Baqarah", mean: "Sapi Betina", type: "Madaniyah", ayat: 286 },
            { num: 36, name: "Ya Sin", mean: "Ya Sin", type: "Makkiyah", ayat: 83 },
            { num: 18, name: "Al-Kahfi", mean: "Gua", type: "Makkiyah", ayat: 110 },
            { num: 56, name: "Al-Waqi'ah", mean: "Hari Kiamat", type: "Makkiyah", ayat: 96 },
            { num: 67, name: "Al-Mulk", mean: "Kerajaan", type: "Makkiyah", ayat: 30 },
            { num: 1, name: "Al-Fatihah", mean: "Pembukaan", type: "Makkiyah", ayat: 7 },
            { num: 2, name: "Al-Baqarah", mean: "Sapi Betina", type: "Madaniyah", ayat: 286 },
            { num: 36, name: "Ya Sin", mean: "Ya Sin", type: "Makkiyah", ayat: 83 },
            { num: 18, name: "Al-Kahfi", mean: "Gua", type: "Makkiyah", ayat: 110 },
            { num: 56, name: "Al-Waqi'ah", mean: "Hari Kiamat", type: "Makkiyah", ayat: 96 },
            { num: 67, name: "Al-Mulk", mean: "Kerajaan", type: "Makkiyah", ayat: 30 },
        ];

        // --- CORE FUNCTIONS ---

        async function initApp() {
            lucide.createIcons();
            renderMenu();
            renderArticles();
            renderQuran();
            setupTasbih();
            
            try {
                await fetchPrayerTimes();
                startClock();
            } catch (e) {
                console.error("Failed to load prayer times", e);
                document.getElementById('next-prayer-name').innerText = "Gagal memuat jadwal";
            }
        }

        async function fetchPrayerTimes() {
            const today = new Date();
            // Format tanggal DD-MM-YYYY untuk API jika perlu, tapi endpoint timingsByCity otomatis hari ini
            const res = await fetch(API_URL);
            const data = await res.json();
            
            if(data.code === 200) {
                const timings = data.data.timings;
                const hijri = data.data.date.hijri;
                
                appData.prayerTimes = {
                    Subuh: timings.Fajr,
                    Dzuhur: timings.Dhuhr,
                    Ashar: timings.Asr,
                    Maghrib: timings.Maghrib,
                    Isya: timings.Isha
                };

                // Update UI Date
                document.getElementById('hijri-date').innerText = `${hijri.day} ${hijri.month.en} ${hijri.year}`;
                
                renderPrayerGrid();
                calculateNextPrayer();
            }
        }

        function calculateNextPrayer() {
            if(!appData.prayerTimes) return;
            
            const now = new Date();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            let nextPrayerName = "Subuh";
            let nextPrayerTimeStr = appData.prayerTimes.Subuh;
            let found = false;

            const timeToMinutes = (timeStr) => {
                const [h, m] = timeStr.split(':').map(Number);
                return h * 60 + m;
            };

            for (const [name, time] of Object.entries(appData.prayerTimes)) {
                const prayerMinutes = timeToMinutes(time);
                if (prayerMinutes > currentMinutes) {
                    nextPrayerName = name;
                    nextPrayerTimeStr = time;
                    found = true;
                    break;
                }
            }
            
            // Jika tidak ada jadwal tersisa hari ini, berarti Subuh besok
            if (!found) {
                nextPrayerName = "Subuh";
                nextPrayerTimeStr = appData.prayerTimes.Subuh; // Logic sederhana, idealnya ambil jadwal besok
            }

            appData.nextPrayer = { name: nextPrayerName, time: nextPrayerTimeStr };
            
            document.getElementById('next-prayer-name').innerHTML = `Menuju <span class="font-bold text-white">${nextPrayerName}</span> (${nextPrayerTimeStr})`;
        }

        function startClock() {
            setInterval(() => {
                if(!appData.nextPrayer) return;

                const now = new Date();
                const [targetH, targetM] = appData.nextPrayer.time.split(':').map(Number);
                
                let targetDate = new Date();
                targetDate.setHours(targetH, targetM, 0);

                // Jika target jam lebih kecil dari sekarang, berarti besok
                if (targetDate < now) {
                    targetDate.setDate(targetDate.getDate() + 1);
                }

                const diff = targetDate - now;
                
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById('countdown-timer').innerText = 
                    `-${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            }, 1000);
        }

        // --- RENDERING UI ---

        function renderMenu() {
            const container = document.getElementById('menu-grid-container');
            container.innerHTML = MENU_ITEMS.map(item => `
                <div onclick="${item.action || ''}" class="flex flex-col items-center gap-2 cursor-pointer group active:scale-95 transition-transform duration-200">
                    <div class="w-14 h-14 ${item.bg} rounded-2xl flex items-center justify-center shadow-sm border border-gray-100 group-hover:shadow-md transition-all">
                        <i data-lucide="${item.icon}" class="${item.color} w-6 h-6"></i>
                    </div>
                    <span class="text-[11px] font-medium text-gray-600 text-center leading-tight">${item.label}</span>
                </div>
            `).join('');
        }

        function renderPrayerGrid() {
            const container = document.getElementById('prayer-mini-grid');
            container.innerHTML = Object.entries(appData.prayerTimes).map(([name, time]) => `
                <div class="flex flex-col items-center p-1 rounded-lg ${name === appData.nextPrayer?.name ? 'bg-white/20' : ''}">
                    <span class="text-[10px] text-emerald-200 mb-1">${name}</span>
                    <span class="text-xs font-bold text-white">${time}</span>
                </div>
            `).join('');
        }

        function renderArticles() {
            const container = document.getElementById('article-list');
            container.innerHTML = ARTICLES.map(art => `
                <div class="bg-white rounded-xl p-3 shadow-sm border border-gray-100 flex gap-3 active:bg-gray-50 transition cursor-pointer">
                    <img src="${art.img}" class="w-24 h-24 object-cover rounded-lg flex-shrink-0 bg-gray-200" alt="img">
                    <div class="flex flex-col justify-between py-1">
                        <div>
                            <span class="text-[10px] font-bold text-nu-600 uppercase tracking-wide bg-nu-50 px-2 py-0.5 rounded-md">${art.cat}</span>
                            <h3 class="font-bold text-sm text-gray-800 leading-snug mt-1.5 line-clamp-2">${art.title}</h3>
                        </div>
                        <span class="text-[10px] text-gray-400 font-medium">${art.date}</span>
                    </div>
                </div>
            `).join('');
        }

        function renderQuran() {
            const container = document.getElementById('quran-list');
            container.innerHTML = SURAH_DATA.map(surah => `
                <div class="px-5 py-4 border-b border-gray-50 hover:bg-gray-50 transition flex items-center justify-between cursor-pointer group">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 bg-gray-100 rounded-lg flex items-center justify-center font-bold text-nu-700 text-sm font-sans group-hover:bg-nu-600 group-hover:text-white transition">
                            ${surah.num}
                        </div>
                        <div>
                            <h4 class="font-bold text-gray-800 text-base">${surah.name}</h4>
                            <p class="text-xs text-gray-400 mt-0.5">${surah.mean} • ${surah.ayat} Ayat</p>
                        </div>
                    </div>
                    <div class="text-right">
                         <span class="text-xl font-arabic text-gray-800 leading-none">...</span>
                    </div>
                </div>
            `).join('');
        }

        // --- TASBIH LOGIC ---
        function setupTasbih() {
            const btn = document.getElementById('btn-tasbih-count');
            const reset = document.getElementById('btn-tasbih-reset');
            const display = document.getElementById('tasbih-count');

            const increment = () => {
                appData.tasbihCount++;
                display.innerText = appData.tasbihCount;
                display.classList.remove('scale-150');
                void display.offsetWidth; // trigger reflow
                display.classList.add('scale-150', 'transition', 'duration-100');
                setTimeout(() => display.classList.remove('scale-150'), 100);
                
                if (navigator.vibrate) navigator.vibrate(40); // Haptic
            };

            btn.addEventListener('click', increment);
            // Klik area kosong di tasbih view juga trigger (UX convenience)
            document.getElementById('view-tasbih').addEventListener('click', (e) => {
                if(e.target === document.getElementById('view-tasbih') || e.target.closest('.tasbih-ring')) {
                    increment();
                }
            });

            reset.addEventListener('click', (e) => {
                e.stopPropagation();
                if(confirm("Mulai ulang dzikir?")) {
                    appData.tasbihCount = 0;
                    display.innerText = 0;
                }
            });
        }

        // --- NAVIGATION ---
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => {
                el.classList.remove('active');
                setTimeout(() => el.classList.remove('flex'), 300); // Wait for transition
            });

            const target = document.getElementById(viewId);
            target.style.display = 'flex';
            // Force reflow
            void target.offsetWidth;
            target.classList.add('active');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            // Re-init icons just in case
            lucide.createIcons();
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
