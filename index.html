<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NU Online Super App</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            /* Palette Warna (Diambil dari config Tailwind sebelumnya) */
            --nu-50: #ecfdf5;
            --nu-100: #d1fae5;
            --nu-500: #10b981;
            --nu-600: #059669;
            --nu-700: #047857;
            --nu-800: #065f46;
            --nu-900: #064e3b;
            --nu-gold: #fbbf24;
            
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-700: #374151;
            --gray-800: #1f2937;
            
            --orange-500: #f97316;
            --amber-500: #f59e0b;

            /* Spacing & Sizes */
            --app-max-width: 448px; /* Setara max-w-md */
            --nav-height: 80px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--gray-100);
            display: flex;
            justify-content: center;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        /* --- UTILITIES --- */
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .text-center { text-align: center; }
        .font-bold { font-weight: 700; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        
        /* Scrollbar Hide */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* --- APP CONTAINER --- */
        .app-container {
            width: 100%;
            max-width: var(--app-max-width);
            height: 100%;
            background-color: var(--gray-50);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 100px; /* Space for navbar */
            background-color: var(--gray-50);
        }

        /* --- HEADER SECTION --- */
        .header-bg {
            background-color: var(--nu-900);
            color: white;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            overflow: hidden;
            padding-bottom: 2rem;
            position: relative;
        }

        /* Background Decorations */
        .bg-pattern {
            position: absolute;
            inset: 0;
            opacity: 0.1;
            background-image: radial-gradient(#fff 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .bg-blob-1 {
            position: absolute;
            right: -2.5rem; top: -2.5rem;
            width: 10rem; height: 10rem;
            background-color: var(--nu-500);
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.3;
        }
        .bg-blob-2 {
            position: absolute;
            left: -2.5rem; bottom: 0;
            width: 8rem; height: 8rem;
            background-color: var(--nu-gold);
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.2;
        }

        /* Top Bar */
        .top-bar {
            position: relative;
            z-index: 10;
            padding: 2rem 1.5rem 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .brand-logo {
            width: 2.5rem; height: 2.5rem;
            background-color: white;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .brand-logo img {
            width: 100%; height: 100%;
            object-fit: contain;
            filter: grayscale(100%) brightness(0); /* Simulating brightness-0 inversion fix */
        }
        /* Fix filter to match original */
        .brand-logo img { filter: none; } 

        .brand-text h1 { font-size: 1.125rem; line-height: 1.25; margin: 0; }
        .brand-text p { font-size: 10px; color: var(--nu-200); text-transform: uppercase; letter-spacing: 0.1em; margin: 0; }
        
        .icon-btn {
            background-color: rgba(255, 255, 255, 0.1);
            border: none;
            padding: 0.5rem;
            border-radius: 9999px;
            backdrop-filter: blur(4px);
            cursor: pointer;
            color: white;
            transition: background 0.2s;
            display: inline-flex;
        }
        .icon-btn:active { transform: scale(0.95); }
        .header-actions { display: flex; gap: 0.75rem; }

        /* Prayer Widget */
        .prayer-widget {
            margin: 0.5rem 1.5rem 0 1.5rem;
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .prayer-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .location { display: flex; align-items: center; gap: 0.375rem; color: var(--nu-100); margin-bottom: 0.25rem; }
        .location span { font-size: 0.75rem; font-weight: 500; }
        .clock-time { font-size: 1.875rem; font-weight: 700; line-height: 1; margin: 0; }
        .next-prayer { font-size: 0.75rem; color: var(--nu-200); margin-top: 0.25rem; }
        
        .date-badge {
            background-color: rgba(6, 95, 70, 0.5); /* nu-800/50 */
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 10px;
            color: var(--nu-100);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: inline-block;
            margin-bottom: 0.25rem;
        }
        .highlight-prayer { font-size: 1.25rem; font-weight: 700; color: #facc15; /* yellow-400 */ }
        
        .mini-schedule {
            margin-top: 1rem;
            padding-top: 0.75rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            text-align: center;
        }
        .mini-item { display: flex; flex-direction: column; align-items: center; }
        .mini-label { font-size: 10px; color: var(--nu-200); opacity: 0.8; margin-bottom: 0.25rem; }
        .mini-time { font-size: 0.875rem; font-weight: 700; }

        /* --- MENU GRID --- */
        .menu-container {
            padding: 0 1.5rem;
            margin-top: -1.5rem;
            position: relative;
            z-index: 20;
        }
        .menu-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
            padding: 1.25rem;
        }
        .grid-layout {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            row-gap: 1.5rem;
            column-gap: 0.5rem;
        }
        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .menu-item:active { opacity: 0.6; }
        .icon-box {
            width: 3.5rem; height: 3.5rem;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(243, 244, 246, 0.5);
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: box-shadow 0.2s;
        }
        .menu-item:hover .icon-box { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .menu-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--gray-700);
            text-align: center;
            line-height: 1.1;
        }

        /* Color Themes for Menu Icons (Generated via classes) */
        .theme-green { background-color: #f0fdf4; color: #16a34a; }
        .theme-red { background-color: #fef2f2; color: #ef4444; }
        .theme-blue { background-color: #eff6ff; color: #2563eb; }
        .theme-purple { background-color: #faf5ff; color: #9333ea; }
        .theme-emerald { background-color: #ecfdf5; color: #059669; }
        .theme-orange { background-color: #fff7ed; color: #ea580c; }
        .theme-teal { background-color: #f0fdfa; color: #0d9488; }
        .theme-gray { background-color: #f3f4f6; color: #6b7280; }

        /* --- ARTICLES SECTION --- */
        .articles-container { padding: 1.5rem; padding-bottom: 1.5rem; }
        
        /* Donation Banner */
        .banner {
            background: linear-gradient(to right, var(--orange-500), var(--amber-500));
            border-radius: 1rem;
            padding: 1rem;
            color: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .banner-content { position: relative; z-index: 10; }
        .banner-content h3 { font-weight: 700; margin: 0; }
        .banner-content p { font-size: 0.75rem; color: #ffedd5; margin-top: 0.125rem; }
        .btn-donate {
            position: relative; z-index: 10;
            background: white;
            color: #ea580c;
            border: none;
            padding: 0.375rem 1rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            cursor: pointer;
        }
        .banner-deco {
            position: absolute; right: -1.25rem; bottom: -1.25rem;
            width: 6rem; height: 6rem;
            background: white; opacity: 0.1;
            border-radius: 50%;
            transition: transform 0.5s;
        }
        .banner:hover .banner-deco { transform: scale(1.1); }

        /* Article List */
        .section-header {
            display: flex; justify-content: space-between; align-items: flex-end;
            margin-bottom: 1rem;
        }
        .section-title {
            font-weight: 700; color: var(--gray-800); font-size: 1.125rem;
            border-left: 4px solid var(--nu-600);
            padding-left: 0.75rem;
            line-height: 1;
        }
        .see-all {
            font-size: 0.75rem; font-weight: 700; color: var(--nu-600);
            text-decoration: none; display: flex; align-items: center;
        }

        .article-card {
            background: white;
            padding: 0.75rem;
            border-radius: 0.75rem;
            border: 1px solid var(--gray-100);
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
            transition: background 0.2s;
        }
        .article-card:active { background: var(--gray-50); }
        .article-img {
            width: 5rem; height: 5rem;
            border-radius: 0.5rem;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--gray-200);
        }
        .article-content {
            display: flex; flex-direction: column; justify-content: space-between;
            width: 100%; padding: 0.125rem 0;
        }
        .badge {
            font-size: 10px; font-weight: 700; color: var(--nu-700);
            background: var(--nu-50);
            padding: 2px 8px; border-radius: 0.25rem;
            display: inline-block; margin-bottom: 0.25rem;
        }
        .article-title {
            font-size: 0.875rem; font-weight: 700; color: var(--gray-800);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .article-meta {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 0.5rem;
        }
        .article-date { font-size: 10px; color: var(--gray-400); }

        /* --- VIEW: QURAN --- */
        .view-quran {
            min-height: 100%;
            background: white;
            display: flex; flex-direction: column;
        }
        .sticky-header {
            position: sticky; top: 0; z-index: 30;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--gray-100);
            padding: 0.75rem 1rem;
            display: flex; align-items: center; gap: 0.75rem;
        }
        .back-btn {
            background: none; border: none; padding: 0.5rem;
            border-radius: 9999px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .back-btn:hover { background: var(--gray-50); }
        
        .surah-item {
            display: flex; items-center: center;
            padding: 0.75rem;
            border: 1px solid var(--gray-100);
            border-radius: 0.75rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .surah-item:hover { background: var(--gray-50); }
        .surah-number {
            width: 2rem; height: 2rem;
            background: var(--nu-50);
            border-radius: 0.5rem;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.875rem; font-weight: 700; color: var(--nu-700);
            margin-right: 0.75rem;
        }
        .surah-info { flex: 1; }
        .surah-title { font-weight: 700; color: var(--gray-800); font-size: 1rem; margin: 0; }
        .surah-desc { font-size: 0.75rem; color: var(--gray-500); margin: 0; }

        /* --- VIEW: TASBIH --- */
        .view-tasbih {
            min-height: 100%;
            background: var(--nu-50);
            display: flex; flex-direction: column;
            position: relative;
        }
        .bg-tasbih-deco {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            opacity: 0.05; pointer-events: none;
        }
        .tasbih-header {
            position: relative; z-index: 10;
            padding: 1rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .tasbih-btn-round {
            padding: 0.5rem; background: rgba(255,255,255,0.5);
            border-radius: 9999px; border: none; cursor: pointer;
            display: flex; align-items: center;
        }
        .tasbih-btn-round:hover { background: white; }
        
        .tasbih-main {
            flex: 1;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            margin-top: -2.5rem;
        }
        .touch-area {
            width: 18rem; height: 18rem;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.15);
            border: 8px solid white;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: relative;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s;
            overflow: hidden; /* For ripple */
        }
        .touch-area:active { transform: scale(0.95); }
        .count-label { font-size: 0.75rem; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem; }
        .count-num { font-size: 6rem; font-weight: 700; color: var(--nu-600); font-family: monospace; line-height: 1; }
        .target-pill {
            position: absolute; bottom: 2.5rem;
            font-size: 0.75rem; color: var(--nu-500);
            background: var(--nu-50);
            padding: 0.25rem 0.75rem; border-radius: 9999px;
        }
        .tasbih-hint {
            margin-top: 2rem;
            color: var(--nu-700);
            font-weight: 500;
            opacity: 0.6;
            animation: pulse 2s infinite;
        }

        /* --- BOTTOM NAV --- */
        .bottom-nav {
            background: white;
            border-top: 1px solid var(--gray-100);
            padding: 0.5rem 1.5rem 1rem 1.5rem;
            box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.05);
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            height: var(--nav-height);
            position: absolute;
            bottom: 0;
            width: 100%;
            max-width: var(--app-max-width);
        }
        .nav-item {
            background: none; border: none;
            display: flex; flex-direction: column;
            align-items: center; gap: 0.25rem;
            width: 3.5rem;
            color: var(--gray-400);
            cursor: pointer;
            transition: color 0.2s;
        }
        .nav-item:hover, .nav-item.active { color: var(--nu-600); }
        .nav-label { font-size: 10px; font-weight: 500; }
        
        .nav-center-wrapper {
            position: relative; top: -1.5rem;
        }
        .nav-center-btn {
            background: var(--nu-600);
            color: white;
            padding: 1rem;
            border-radius: 1rem;
            border: 4px solid var(--gray-50);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.1s;
            display: flex; align-items: center; justify-content: center;
        }
        .nav-center-btn:active { transform: scale(0.95); }

        /* --- ANIMATIONS --- */
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            background-color: rgba(16, 185, 129, 0.2);
            pointer-events: none;
        }
        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 0.3; }
        }
        
        .pulse-skeleton {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            background-color: rgba(255,255,255,0.2);
            height: 2rem; width: 100%; border-radius: 0.25rem;
        }

    </style>
</head>
<body>

    <div class="app-container">

        <main id="main-scroll-area" class="no-scrollbar">
            
            <div id="view-home" class="view-section fade-in">
                
                <header class="header-bg">
                    <div class="bg-pattern"></div>
                    <div class="bg-blob-1"></div>
                    <div class="bg-blob-2"></div>

                    <div class="top-bar">
                        <div class="brand">
                            <div class="brand-logo">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Logo_Nahdlatul_Ulama.svg/1200px-Logo_Nahdlatul_Ulama.svg.png" alt="NU">
                            </div>
                            <div class="brand-text">
                                <h1>NU Online</h1>
                                <p>Super App</p>
                            </div>
                        </div>
                        <div class="header-actions">
                            <button class="icon-btn"><i data-lucide="search" width="20" height="20"></i></button>
                            <button class="icon-btn"><i data-lucide="bell" width="20" height="20"></i></button>
                        </div>
                    </div>

                    <div class="prayer-widget">
                        <div class="prayer-header">
                            <div>
                                <div class="location">
                                    <i data-lucide="map-pin" width="12" height="12"></i>
                                    <span>Jakarta Pusat</span>
                                </div>
                                <h2 class="clock-time" id="clock-main">--:--</h2>
                                <p class="next-prayer" id="next-prayer-info">Memuat jadwal...</p>
                            </div>
                            <div class="text-right" style="text-align: right;">
                                <div class="date-badge">12 Rajab 1446 H</div>
                                <div id="prayer-name-highlight" class="highlight-prayer">Ashar</div>
                            </div>
                        </div>
                        
                        <div class="mini-schedule" id="mini-prayer-schedule">
                            <div class="pulse-skeleton"></div>
                        </div>
                    </div>
                </header>

                <div class="menu-container">
                    <div class="menu-card">
                        <div id="menu-grid" class="grid-layout">
                            </div>
                    </div>
                </div>

                <div class="articles-container">
                    <div class="banner">
                        <div class="banner-content">
                            <h3>Koin NU</h3>
                            <p>Kemandirian umat & bangsa</p>
                        </div>
                        <button class="btn-donate">Donasi</button>
                        <div class="banner-deco"></div>
                    </div>

                    <div class="section-header">
                        <h2 class="section-title">Berita Terkini</h2>
                        <a href="#" class="see-all">Lihat Semua <i data-lucide="chevron-right" width="12" height="12"></i></a>
                    </div>

                    <div id="article-list">
                        </div>
                </div>
            </div>

            <div id="view-quran" class="view-quran hidden">
                <div class="sticky-header">
                    <button onclick="navTo('home')" class="back-btn"><i data-lucide="arrow-left" width="24" height="24"></i></button>
                    <h2 class="font-bold" style="color: var(--gray-800); font-size: 1.125rem;">Al-Qur'an</h2>
                </div>
                <div id="surah-list" style="padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem;">
                    </div>
            </div>

            <div id="view-tasbih" class="view-tasbih hidden">
                <div class="bg-tasbih-deco">
                    <i data-lucide="flower" width="500" height="500" color="var(--nu-700)"></i>
                </div>
                
                <div class="tasbih-header">
                    <button onclick="navTo('home')" class="tasbih-btn-round"><i data-lucide="arrow-left" width="24" height="24" color="var(--nu-800)"></i></button>
                    <h2 class="font-bold" style="color: var(--nu-900); font-size: 1.125rem;">Tasbih Digital</h2>
                    <button onclick="resetTasbih()" class="tasbih-btn-round"><i data-lucide="rotate-ccw" width="20" height="20" color="var(--nu-700)"></i></button>
                </div>

                <div class="tasbih-main">
                    <div id="tasbih-touch-area" class="touch-area">
                        <span class="count-label">Hitungan</span>
                        <span id="tasbih-counter" class="count-num">0</span>
                        <div class="target-pill">Target: 33</div>
                    </div>
                    <p class="tasbih-hint">Ketuk lingkaran untuk bertasbih</p>
                </div>
            </div>

        </main>

        <nav class="bottom-nav">
            <button onclick="navTo('home')" class="nav-item active">
                <i data-lucide="home" width="24" height="24"></i>
                <span class="nav-label">Beranda</span>
            </button>
            
            <button class="nav-item">
                <i data-lucide="calendar" width="24" height="24"></i>
                <span class="nav-label">Jadwal</span>
            </button>

            <div class="nav-center-wrapper">
                <button onclick="navTo('quran')" class="nav-center-btn">
                    <i data-lucide="book-open" width="28" height="28"></i>
                </button>
            </div>

            <button class="nav-item">
                <i data-lucide="compass" width="24" height="24"></i>
                <span class="nav-label">Kiblat</span>
            </button>
            
            <button class="nav-item">
                <i data-lucide="menu" width="24" height="24"></i>
                <span class="nav-label">Lainnya</span>
            </button>
        </nav>

    </div>

    <script>
        // --- DATA ---
        // Updated colors to generic themes mapped in CSS
        const MENU_DATA = [
            { label: "Al-Qur'an", icon: "book", theme: "theme-green", action: "navTo('quran')" },
            { label: "Yasin", icon: "heart", theme: "theme-red", action: "" },
            { label: "Tahlil", icon: "users", theme: "theme-blue", action: "" },
            { label: "Maulid", icon: "moon", theme: "theme-purple", action: "" },
            { label: "Tasbih", icon: "fingerprint", theme: "theme-emerald", action: "navTo('tasbih')" },
            { label: "Ziarah", icon: "map-pin", theme: "theme-orange", action: "" },
            { label: "Zakat", icon: "wallet", theme: "theme-teal", action: "" },
            { label: "Lainnya", icon: "grid", theme: "theme-gray", action: "" }
        ];

        const ARTICLES_DATA = [
            { title: "Khutbah Jumat: Menjaga Lisan di Tahun Politik", cat: "Khutbah", img: "https://placehold.co/100x100/047857/ffffff?text=Khutbah", date: "1 Jam lalu" },
            { title: "Hukum Sholat Rebo Wekasan Menurut Ulama NU", cat: "Syariah", img: "https://placehold.co/100x100/059669/ffffff?text=Syariah", date: "3 Jam lalu" },
            { title: "PBNU Instruksikan Doa Bersama untuk Palestina", cat: "Nasional", img: "https://placehold.co/100x100/065f46/ffffff?text=PBNU", date: "5 Jam lalu" },
            { title: "Sejarah Berdirinya Nahdlatul Ulama", cat: "Sejarah", img: "https://placehold.co/100x100/064e3b/ffffff?text=Sejarah", date: "1 Hari lalu" }
        ];

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            renderMenu();
            renderArticles();
            renderQuranList();
            initClock();
            
            lucide.createIcons();
        });

        // --- RENDER FUNCTIONS ---
        function renderMenu() {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = MENU_DATA.map(item => `
                <div onclick="${item.action}" class="menu-item">
                    <div class="icon-box ${item.theme}">
                        <i data-lucide="${item.icon}" width="24" height="24"></i>
                    </div>
                    <span class="menu-label">${item.label}</span>
                </div>
            `).join('');
        }

        function renderArticles() {
            const list = document.getElementById('article-list');
            list.innerHTML = ARTICLES_DATA.map(art => `
                <div class="article-card">
                    <img src="${art.img}" class="article-img">
                    <div class="article-content">
                        <div>
                            <span class="badge">${art.cat}</span>
                            <h3 class="article-title">${art.title}</h3>
                        </div>
                        <div class="article-meta">
                            <span class="article-date">${art.date}</span>
                            <i data-lucide="share-2" width="12" height="12" color="var(--gray-400)"></i>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderQuranList() {
            const container = document.getElementById('surah-list');
            const surahs = [
                {n:1, t:"Al-Fatihah", a:7}, {n:2, t:"Al-Baqarah", a:286}, {n:36, t:"Ya Sin", a:83}, 
                {n:18, t:"Al-Kahfi", a:110}, {n:56, t:"Al-Waqi'ah", a:96}, {n:67, t:"Al-Mulk", a:30}
            ];
            container.innerHTML = surahs.map(s => `
                <div class="surah-item">
                    <div class="surah-number">${s.n}</div>
                    <div class="surah-info">
                        <h4 class="surah-title">${s.t}</h4>
                        <p class="surah-desc">${s.a} Ayat</p>
                    </div>
                    <i data-lucide="chevron-right" width="16" height="16" color="var(--gray-400)"></i>
                </div>
            `).join('');
        }

        // --- PRAYER API ---
        async function initClock() {
            updateTime();
            setInterval(updateTime, 1000);

            try {
                // Fetch Jakarta Prayer Times
                const res = await fetch("https://api.aladhan.com/v1/timingsByCity?city=Jakarta&country=Indonesia&method=20");
                const data = await res.json();
                const timings = data.data.timings;
                
                // Render Mini Schedule
                const mini = document.getElementById('mini-prayer-schedule');
                const list = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
                const mapName = {Fajr:'Subuh', Dhuhr:'Dzuhur', Asr:'Ashar', Maghrib:'Maghrib', Isha:'Isya'};
                
                mini.innerHTML = list.map(k => `
                    <div class="mini-item">
                        <span class="mini-label">${mapName[k]}</span>
                        <span class="mini-time">${timings[k]}</span>
                    </div>
                `).join('');
                
                document.getElementById('next-prayer-info').textContent = "Menuju Maghrib";

            } catch(e) {
                console.log("Offline mode or API Error");
                document.getElementById('mini-prayer-schedule').innerHTML = '<div style="font-size:10px; width:100%; text-align:center;">Gagal memuat jadwal</div>';
            }
        }

        function updateTime() {
            const now = new Date();
            document.getElementById('clock-main').innerText = now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
        }

        // --- NAVIGATION LOGIC ---
        function navTo(viewId) {
            // Hide all views
            ['view-home', 'view-quran', 'view-tasbih'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });

            // Show target
            const target = document.getElementById(`view-${viewId}`);
            target.classList.remove('hidden');

            // Scroll to top
            document.getElementById('main-scroll-area').scrollTop = 0;
            
            // Re-render icons
            lucide.createIcons();
        }

        // --- TASBIH LOGIC ---
        let count = 0;
        const touchArea = document.getElementById('tasbih-touch-area');
        touchArea.addEventListener('click', (e) => {
            count++;
            document.getElementById('tasbih-counter').innerText = count;
            
            // Haptic
            if(navigator.vibrate) navigator.vibrate(30);

            // Visual Ripple
            const ripple = document.createElement("span");
            ripple.classList.add("ripple");
            const rect = touchArea.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = `${size}px`;
            ripple.style.left = `${e.clientX - rect.left - size/2}px`;
            ripple.style.top = `${e.clientY - rect.top - size/2}px`;
            touchArea.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });

        function resetTasbih() {
            if(confirm('Reset hitungan?')) {
                count = 0;
                document.getElementById('tasbih-counter').innerText = 0;
            }
        }

    </script>
</body>
</html>
