<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NU Online Super App</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        arabic: ['"Noto Naskh Arabic"', 'serif'],
                    },
                    colors: {
                        nu: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857', // NU Green Official-ish
                            800: '#065f46',
                            900: '#064e3b',
                            gold: '#fbbf24' 
                        }
                    },
                    boxShadow: {
                        'up': '0 -4px 6px -1px rgba(0, 0, 0, 0.05)',
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                    }
                }
            }
        }
    </script>

    <style>
        /* Base Setup */
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f3f4f6; /* gray-100 */
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Hide Scrollbar but keep functionality */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animation Classes */
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tasbih Ripple */
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple 0.6s linear;
            background-color: rgba(255, 255, 255, 0.3);
        }
        @keyframes ripple {
            to { transform: scale(4); opacity: 0; }
        }
    </style>
</head>
<body class="flex justify-center h-screen w-full overflow-hidden">

    <!-- MOBILE APP FRAME (Fixed Width on Desktop, Full on Mobile) -->
    <div class="w-full max-w-md h-full bg-gray-50 flex flex-col relative shadow-2xl">

        <!-- ================= MAIN CONTENT AREA (SCROLLABLE) ================= -->
        <main id="main-scroll-area" class="flex-1 overflow-y-auto no-scrollbar pb-24 relative bg-gray-50">
            
            <!-- VIEW: HOME -->
            <div id="view-home" class="view-section fade-in">
                
                <!-- Header Section -->
                <header class="bg-nu-900 text-white relative rounded-b-[30px] overflow-hidden pb-8">
                    <!-- Background Pattern -->
                    <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 20px 20px;"></div>
                    <div class="absolute -right-10 -top-10 w-40 h-40 bg-nu-500 rounded-full blur-3xl opacity-30"></div>
                    <div class="absolute -left-10 bottom-0 w-32 h-32 bg-yellow-500 rounded-full blur-3xl opacity-20"></div>

                    <!-- Top Bar -->
                    <div class="relative z-10 px-6 pt-8 pb-4 flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center p-1 shadow-lg">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Logo_Nahdlatul_Ulama.svg/1200px-Logo_Nahdlatul_Ulama.svg.png" class="w-full h-full object-contain brightness-0 invert filter brightness-100" style="filter: none;" alt="NU">
                            </div>
                            <div>
                                <h1 class="font-bold text-lg leading-tight">NU Online</h1>
                                <p class="text-[10px] text-nu-200 uppercase tracking-widest">Super App</p>
                            </div>
                        </div>
                        <div class="flex gap-3">
                            <button class="bg-white/10 p-2 rounded-full backdrop-blur-sm hover:bg-white/20 active:scale-95 transition"><i data-lucide="search" class="w-5 h-5"></i></button>
                            <button class="bg-white/10 p-2 rounded-full backdrop-blur-sm hover:bg-white/20 active:scale-95 transition"><i data-lucide="bell" class="w-5 h-5"></i></button>
                        </div>
                    </div>

                    <!-- Prayer Widget -->
                    <div class="mx-6 mt-2 relative z-10">
                        <div class="bg-white/10 backdrop-blur-md border border-white/10 rounded-2xl p-4 shadow-xl">
                            <div class="flex justify-between items-start">
                                <div>
                                    <div class="flex items-center gap-1.5 text-nu-100 mb-1">
                                        <i data-lucide="map-pin" class="w-3 h-3"></i>
                                        <span class="text-xs font-medium">Jakarta Pusat</span>
                                    </div>
                                    <h2 class="text-3xl font-bold tracking-tight mb-0" id="clock-main">--:--</h2>
                                    <p class="text-xs text-nu-200" id="next-prayer-info">Memuat jadwal...</p>
                                </div>
                                <div class="text-right">
                                    <div class="bg-nu-800/50 px-2 py-1 rounded text-[10px] text-nu-100 border border-white/5 inline-block mb-1">
                                        12 Rajab 1446 H
                                    </div>
                                    <div id="prayer-name-highlight" class="text-xl font-bold text-yellow-400">Ashar</div>
                                </div>
                            </div>
                            
                            <!-- Mini Schedule -->
                            <div class="mt-4 pt-3 border-t border-white/10 flex justify-between text-center" id="mini-prayer-schedule">
                                <!-- JS Injected -->
                                <div class="animate-pulse h-8 w-full bg-white/10 rounded"></div>
                            </div>
                        </div>
                    </div>
                </header>

                <!-- Menu Grid -->
                <div class="px-6 -mt-6 relative z-20">
                    <div class="bg-white rounded-2xl shadow-soft p-5">
                        <div id="menu-grid" class="grid grid-cols-4 gap-y-6 gap-x-2">
                            <!-- JS Injected Icons will go here -->
                        </div>
                    </div>
                </div>

                <!-- Articles Section -->
                <div class="px-6 mt-6 pb-6">
                    <!-- Banner -->
                    <div class="bg-gradient-to-r from-orange-500 to-amber-500 rounded-2xl p-4 text-white shadow-lg mb-6 flex justify-between items-center relative overflow-hidden group">
                        <div class="relative z-10">
                            <h3 class="font-bold">Koin NU</h3>
                            <p class="text-xs text-orange-100 mt-0.5">Kemandirian umat & bangsa</p>
                        </div>
                        <button class="relative z-10 bg-white text-orange-600 px-4 py-1.5 rounded-full text-xs font-bold shadow hover:bg-gray-50 transition">Donasi</button>
                        <div class="absolute -right-5 -bottom-5 w-24 h-24 bg-white opacity-10 rounded-full group-hover:scale-110 transition duration-500"></div>
                    </div>

                    <div class="flex justify-between items-end mb-4">
                        <h2 class="font-bold text-gray-800 text-lg border-l-4 border-nu-600 pl-3">Berita Terkini</h2>
                        <a href="#" class="text-xs font-bold text-nu-600 flex items-center">Lihat Semua <i data-lucide="chevron-right" class="w-3 h-3 ml-1"></i></a>
                    </div>

                    <div id="article-list" class="space-y-4">
                        <!-- JS Injected -->
                    </div>
                </div>
            </div>

            <!-- VIEW: QURAN -->
            <div id="view-quran" class="hidden min-h-full bg-white flex-col">
                <div class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-gray-100 px-4 py-3 flex items-center gap-3">
                    <button onclick="navTo('home')" class="p-2 hover:bg-gray-50 rounded-full"><i data-lucide="arrow-left" class="w-6 h-6 text-gray-700"></i></button>
                    <h2 class="font-bold text-lg text-gray-800">Al-Qur'an</h2>
                </div>
                <div id="surah-list" class="p-4 space-y-2">
                    <!-- JS Injected -->
                </div>
            </div>

            <!-- VIEW: TASBIH -->
            <div id="view-tasbih" class="hidden min-h-full bg-nu-50 flex-col relative">
                <div class="absolute inset-0 flex items-center justify-center opacity-5 pointer-events-none overflow-hidden">
                    <i data-lucide="flower" class="w-[500px] h-[500px] text-nu-700"></i>
                </div>
                
                <div class="relative z-10 p-4 flex justify-between items-center">
                    <button onclick="navTo('home')" class="p-2 bg-white/50 rounded-full hover:bg-white"><i data-lucide="arrow-left" class="w-6 h-6 text-nu-800"></i></button>
                    <h2 class="font-bold text-lg text-nu-900">Tasbih Digital</h2>
                    <button onclick="resetTasbih()" class="p-2 bg-white/50 rounded-full hover:bg-white text-nu-700"><i data-lucide="rotate-ccw" class="w-5 h-5"></i></button>
                </div>

                <div class="flex-1 flex flex-col items-center justify-center -mt-10">
                    <div id="tasbih-touch-area" class="w-72 h-72 rounded-full bg-white shadow-[0_0_40px_rgba(16,185,129,0.15)] border-8 border-white flex flex-col items-center justify-center relative active:scale-95 transition-transform duration-100 cursor-pointer select-none">
                        <span class="text-xs text-gray-400 uppercase tracking-widest mb-2">Hitungan</span>
                        <span id="tasbih-counter" class="text-8xl font-bold text-nu-600 font-mono">0</span>
                        <div class="absolute bottom-10 text-xs text-nu-400 bg-nu-50 px-3 py-1 rounded-full">Target: 33</div>
                    </div>
                    <p class="mt-8 text-nu-700 font-medium opacity-60 animate-pulse">Ketuk lingkaran untuk bertasbih</p>
                </div>
            </div>

        </main>

        <!-- ================= BOTTOM NAVIGATION (FIXED) ================= -->
        <!-- Nav is OUTSIDE main-scroll-area, so it stays fixed at bottom -->
        <nav class="bg-white border-t border-gray-100 px-6 py-2 pb-4 shadow-up z-50 flex justify-between items-end h-[80px] relative">
            
            <button onclick="navTo('home')" class="nav-item flex flex-col items-center gap-1 w-14 text-nu-600">
                <i data-lucide="home" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium">Beranda</span>
            </button>
            
            <button class="nav-item flex flex-col items-center gap-1 w-14 text-gray-400 hover:text-nu-600 transition">
                <i data-lucide="calendar" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium">Jadwal</span>
            </button>

            <!-- Floating Center Button -->
            <div class="relative -top-6 group">
                <button onclick="navTo('quran')" class="bg-nu-600 text-white p-4 rounded-2xl shadow-lg border-4 border-gray-50 transform group-active:scale-95 transition">
                    <i data-lucide="book-open" class="w-7 h-7"></i>
                </button>
            </div>

            <button class="nav-item flex flex-col items-center gap-1 w-14 text-gray-400 hover:text-nu-600 transition">
                <i data-lucide="compass" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium">Kiblat</span>
            </button>
            
            <button class="nav-item flex flex-col items-center gap-1 w-14 text-gray-400 hover:text-nu-600 transition">
                <i data-lucide="menu" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium">Lainnya</span>
            </button>
        </nav>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- DATA ---
        const MENU_DATA = [
            { label: "Al-Qur'an", icon: "book", color: "text-green-600", bg: "bg-green-50", action: "navTo('quran')" },
            { label: "Yasin", icon: "heart", color: "text-red-500", bg: "bg-red-50", action: "" },
            { label: "Tahlil", icon: "users", color: "text-blue-600", bg: "bg-blue-50", action: "" },
            { label: "Maulid", icon: "moon", color: "text-purple-600", bg: "bg-purple-50", action: "" },
            { label: "Tasbih", icon: "fingerprint", color: "text-emerald-600", bg: "bg-emerald-50", action: "navTo('tasbih')" },
            { label: "Ziarah", icon: "map-pin", color: "text-orange-600", bg: "bg-orange-50", action: "" },
            { label: "Zakat", icon: "wallet", color: "text-teal-600", bg: "bg-teal-50", action: "" },
            { label: "Lainnya", icon: "grid", color: "text-gray-500", bg: "bg-gray-100", action: "" }
        ];

        const ARTICLES_DATA = [
            { title: "Khutbah Jumat: Menjaga Lisan di Tahun Politik", cat: "Khutbah", img: "https://placehold.co/100x100/047857/ffffff?text=Khutbah", date: "1 Jam lalu" },
            { title: "Hukum Sholat Rebo Wekasan Menurut Ulama NU", cat: "Syariah", img: "https://placehold.co/100x100/059669/ffffff?text=Syariah", date: "3 Jam lalu" },
            { title: "PBNU Instruksikan Doa Bersama untuk Palestina", cat: "Nasional", img: "https://placehold.co/100x100/065f46/ffffff?text=PBNU", date: "5 Jam lalu" },
            { title: "Sejarah Berdirinya Nahdlatul Ulama", cat: "Sejarah", img: "https://placehold.co/100x100/064e3b/ffffff?text=Sejarah", date: "1 Hari lalu" }
        ];

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            renderMenu();
            renderArticles();
            renderQuranList();
            initClock();
            
            // CRITICAL: Call Lucide AFTER rendering everything
            lucide.createIcons();
        });

        // --- RENDER FUNCTIONS ---
        function renderMenu() {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = MENU_DATA.map(item => `
                <div onclick="${item.action}" class="flex flex-col items-center gap-2 cursor-pointer group active:opacity-60 transition">
                    <div class="w-14 h-14 ${item.bg} rounded-2xl flex items-center justify-center shadow-sm group-hover:shadow-md transition-all border border-gray-100/50">
                        <i data-lucide="${item.icon}" class="${item.color} w-6 h-6"></i>
                    </div>
                    <span class="text-[11px] font-medium text-gray-700 text-center leading-tight">${item.label}</span>
                </div>
            `).join('');
        }

        function renderArticles() {
            const list = document.getElementById('article-list');
            list.innerHTML = ARTICLES_DATA.map(art => `
                <div class="bg-white p-3 rounded-xl border border-gray-100 shadow-sm flex gap-3 active:bg-gray-50 transition">
                    <img src="${art.img}" class="w-20 h-20 rounded-lg object-cover flex-shrink-0 bg-gray-200">
                    <div class="flex flex-col justify-between py-0.5 w-full">
                        <div>
                            <span class="text-[10px] font-bold text-nu-700 bg-nu-50 px-2 py-0.5 rounded mb-1 inline-block">${art.cat}</span>
                            <h3 class="text-sm font-bold text-gray-800 leading-snug line-clamp-2">${art.title}</h3>
                        </div>
                        <div class="flex justify-between items-center mt-2">
                            <span class="text-[10px] text-gray-400">${art.date}</span>
                            <i data-lucide="share-2" class="w-3 h-3 text-gray-400"></i>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderQuranList() {
            const container = document.getElementById('surah-list');
            const surahs = [
                {n:1, t:"Al-Fatihah", a:7}, {n:2, t:"Al-Baqarah", a:286}, {n:36, t:"Ya Sin", a:83}, 
                {n:18, t:"Al-Kahfi", a:110}, {n:56, t:"Al-Waqi'ah", a:96}, {n:67, t:"Al-Mulk", a:30}
            ];
            container.innerHTML = surahs.map(s => `
                <div class="flex items-center p-3 border border-gray-100 rounded-xl hover:bg-gray-50 cursor-pointer">
                    <div class="w-8 h-8 bg-nu-50 rounded-lg flex items-center justify-center text-sm font-bold text-nu-700 mr-3">${s.n}</div>
                    <div class="flex-1">
                        <h4 class="font-bold text-gray-800">${s.t}</h4>
                        <p class="text-xs text-gray-500">${s.a} Ayat</p>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
                </div>
            `).join('');
        }

        // --- PRAYER API ---
        async function initClock() {
            updateTime();
            setInterval(updateTime, 1000);

            try {
                // Fetch Jakarta Prayer Times
                const res = await fetch("https://api.aladhan.com/v1/timingsByCity?city=Jakarta&country=Indonesia&method=20");
                const data = await res.json();
                const timings = data.data.timings;
                
                // Render Mini Schedule
                const mini = document.getElementById('mini-prayer-schedule');
                const list = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
                const mapName = {Fajr:'Subuh', Dhuhr:'Dzuhur', Asr:'Ashar', Maghrib:'Maghrib', Isha:'Isya'};
                
                mini.innerHTML = list.map(k => `
                    <div class="flex flex-col items-center">
                        <span class="text-[10px] text-nu-200 opacity-80 mb-1">${mapName[k]}</span>
                        <span class="text-sm font-bold">${timings[k]}</span>
                    </div>
                `).join('');
                
                document.getElementById('next-prayer-info').textContent = "Menuju Maghrib"; // Simplified logic for demo

            } catch(e) {
                console.log("Offline mode");
                document.getElementById('mini-prayer-schedule').innerHTML = '<div class="text-xs w-full">Gagal memuat jadwal</div>';
            }
        }

        function updateTime() {
            const now = new Date();
            document.getElementById('clock-main').innerText = now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
        }

        // --- NAVIGATION LOGIC ---
        function navTo(viewId) {
            // Hide all views
            ['view-home', 'view-quran', 'view-tasbih'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
                document.getElementById(id).classList.remove('flex');
            });

            // Show target
            const target = document.getElementById(`view-${viewId}`);
            target.classList.remove('hidden');
            target.classList.add(viewId === 'home' ? 'block' : 'flex');

            // Scroll to top
            document.getElementById('main-scroll-area').scrollTop = 0;
            
            // Re-render icons specifically for the new view just in case
            lucide.createIcons();
        }

        // --- TASBIH LOGIC ---
        let count = 0;
        const touchArea = document.getElementById('tasbih-touch-area');
        touchArea.addEventListener('click', (e) => {
            count++;
            document.getElementById('tasbih-counter').innerText = count;
            
            // Haptic
            if(navigator.vibrate) navigator.vibrate(30);

            // Visual Ripple
            const ripple = document.createElement("span");
            ripple.classList.add("ripple");
            const rect = touchArea.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = `${size}px`;
            ripple.style.left = `${e.clientX - rect.left - size/2}px`;
            ripple.style.top = `${e.clientY - rect.top - size/2}px`;
            touchArea.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });

        function resetTasbih() {
            if(confirm('Reset hitungan?')) {
                count = 0;
                document.getElementById('tasbih-counter').innerText = 0;
            }
        }

    </script>
</body>
</html>
