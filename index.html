<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NU Online Super App</title>
    
    <!-- Menggunakan Tailwind CSS via CDN untuk styling cepat -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Menggunakan Lucide Icons via CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Font Noto Sans & Arabic -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Noto Sans', sans-serif; }
        .font-arabic { font-family: 'Noto Naskh Arabic', serif; }
        
        /* Utility class untuk menyembunyikan view */
        .view-section { display: none; }
        .view-section.active { display: flex; }
        
        /* Animasi sederhana untuk tombol tasbih */
        .tasbih-btn:active { transform: scale(0.95); }

        /* Hide scrollbar for clean look */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex justify-center items-start">

    <!-- Container Utama (Mobile Wrapper) -->
    <div class="w-full max-w-md bg-gray-50 min-h-screen relative shadow-2xl overflow-hidden flex flex-col">

        <!-- ================= VIEW: HOME ================= -->
        <div id="view-home" class="view-section active flex-col pb-24 w-full">
            
            <!-- Header & Jadwal Sholat -->
            <header class="bg-emerald-700 text-white pt-6 pb-12 px-4 rounded-b-[2rem] shadow-lg relative overflow-hidden">
                <div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(circle, #ffffff 1px, transparent 1px); background-size: 20px 20px;"></div>

                <div class="relative z-10 flex justify-between items-center mb-6">
                    <div class="flex items-center space-x-2">
                        <div class="bg-white p-1 rounded-lg">
                            <div class="text-emerald-700 font-bold text-lg leading-none">NU</div>
                        </div>
                        <div>
                            <h1 class="font-bold text-lg leading-none">NU Online</h1>
                            <p class="text-xs text-emerald-100">Super App</p>
                        </div>
                    </div>
                    <div class="flex space-x-3">
                        <i data-lucide="search" class="w-5 h-5"></i>
                        <i data-lucide="menu" class="w-5 h-5"></i>
                    </div>
                </div>

                <!-- Widget Jadwal -->
                <div class="bg-white/10 backdrop-blur-sm rounded-xl p-4 border border-white/20">
                    <div class="flex justify-between items-end mb-2">
                        <div>
                            <p class="text-xs text-emerald-100 mb-1">Menuju Ashar</p>
                            <h2 id="clock-display" class="text-3xl font-bold">--:--:--</h2>
                        </div>
                        <div class="text-right">
                            <p class="text-sm font-medium">Jakarta Selatan</p>
                            <p class="text-xs text-emerald-200">12 Rojab 1446 H</p>
                        </div>
                    </div>
                    <!-- Progress Bar -->
                    <div class="h-1 w-full bg-emerald-900/30 rounded-full overflow-hidden mb-3">
                        <div class="h-full bg-yellow-400 w-2/3"></div>
                    </div>
                    <!-- Jadwal Mini -->
                    <div class="flex justify-between text-xs text-emerald-100" id="prayer-mini-list">
                        <!-- Diisi oleh JS -->
                    </div>
                </div>
            </header>

            <!-- Main Menu Grid -->
            <div class="px-4 -mt-6 relative z-20">
                <div class="bg-white rounded-2xl shadow-md p-4 grid grid-cols-4 gap-4">
                    <!-- Menu Items -->
                    <div onclick="switchView('view-quran')" class="flex flex-col items-center gap-2 cursor-pointer group">
                        <div class="w-12 h-12 bg-emerald-50 rounded-xl flex items-center justify-center group-hover:bg-emerald-100 transition">
                            <i data-lucide="book-open" class="text-emerald-600 w-6 h-6"></i>
                        </div>
                        <span class="text-[10px] text-center font-medium text-gray-700">Al-Qur'an</span>
                    </div>

                    <div class="flex flex-col items-center gap-2 cursor-pointer group">
                        <div class="w-12 h-12 bg-emerald-50 rounded-xl flex items-center justify-center group-hover:bg-emerald-100 transition">
                            <i data-lucide="heart" class="text-emerald-600 w-6 h-6"></i>
                        </div>
                        <span class="text-[10px] text-center font-medium text-gray-700">Yasin</span>
                    </div>

                    <div class="flex flex-col items-center gap-2 cursor-pointer group">
                        <div class="w-12 h-12 bg-emerald-50 rounded-xl flex items-center justify-center group-hover:bg-emerald-100 transition">
                            <i data-lucide="clock" class="text-emerald-600 w-6 h-6"></i>
                        </div>
                        <span class="text-[10px] text-center font-medium text-gray-700">Jadwal</span>
                    </div>

                    <div class="flex flex-col items-center gap-2 cursor-pointer group">
                        <div class="w-12 h-12 bg-emerald-50 rounded-xl flex items-center justify-center group-hover:bg-emerald-100 transition">
                            <i data-lucide="compass" class="text-emerald-600 w-6 h-6"></i>
                        </div>
                        <span class="text-[10px] text-center font-medium text-gray-700">Kiblat</span>
                    </div>
                    
                    <div class="flex flex-col items-center gap-2 cursor-pointer group">
                        <div class="w-12 h-12 bg-emerald-50 rounded-xl flex items-center justify-center group-hover:bg-emerald-100 transition">
                            <i data-lucide="moon" class="text-emerald-600 w-6 h-6"></i>
                        </div>
                        <span class="text-[10px] text-center font-medium text-gray-700">Maulid</span>
                    </div>

                    <div onclick="switchView('view-tasbih')" class="flex flex-col items-center gap-2 cursor-pointer group">
                        <div class="w-12 h-12 bg-emerald-50 rounded-xl flex items-center justify-center group-hover:bg-emerald-100 transition">
                            <i data-lucide="rotate-ccw" class="text-emerald-600 w-6 h-6"></i>
                        </div>
                        <span class="text-[10px] text-center font-medium text-gray-700">Tasbih</span>
                    </div>
                    
                    <div class="flex flex-col items-center gap-2 cursor-pointer group">
                        <div class="w-12 h-12 bg-emerald-50 rounded-xl flex items-center justify-center group-hover:bg-emerald-100 transition">
                            <i data-lucide="map-pin" class="text-emerald-600 w-6 h-6"></i>
                        </div>
                        <span class="text-[10px] text-center font-medium text-gray-700">Ziarah</span>
                    </div>

                    <div class="flex flex-col items-center gap-2 cursor-pointer group">
                        <div class="w-12 h-12 bg-emerald-50 rounded-xl flex items-center justify-center group-hover:bg-emerald-100 transition">
                            <i data-lucide="more-horizontal" class="text-gray-400 w-6 h-6"></i>
                        </div>
                        <span class="text-[10px] text-center font-medium text-gray-700">Lainnya</span>
                    </div>
                </div>
            </div>

            <!-- Banner Donasi -->
            <div class="mt-6 px-4">
                <div class="bg-gradient-to-r from-yellow-500 to-orange-500 rounded-xl p-4 text-white flex justify-between items-center shadow-md">
                    <div>
                        <h3 class="font-bold text-lg">Koin NU</h3>
                        <p class="text-xs text-yellow-100">Gerakan kemandirian umat</p>
                    </div>
                    <button class="bg-white text-orange-600 px-4 py-1.5 rounded-full text-xs font-bold shadow-sm active:bg-gray-100">
                        Donasi
                    </button>
                </div>
            </div>

            <!-- List Berita -->
            <div class="mt-6 px-4 pb-4">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold text-gray-800 text-lg border-l-4 border-emerald-600 pl-3">Berita Terkini</h2>
                    <a href="#" class="text-xs text-emerald-600 font-bold flex items-center">Lihat Semua <i data-lucide="chevron-right" class="w-3 h-3 ml-1"></i></a>
                </div>
                <div id="article-list" class="space-y-4">
                    <!-- Diisi oleh JS -->
                </div>
            </div>
            
            <!-- Bottom Navigation -->
            <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 px-6 py-2 flex justify-between items-center z-50 h-[70px]">
                <div class="flex flex-col items-center cursor-pointer text-emerald-600">
                    <i data-lucide="home" class="w-5 h-5"></i>
                    <span class="text-[10px] mt-1 font-medium">Beranda</span>
                </div>
                <div class="flex flex-col items-center cursor-pointer text-gray-400 hover:text-emerald-600">
                    <i data-lucide="clock" class="w-5 h-5"></i>
                    <span class="text-[10px] mt-1 font-medium">Jadwal</span>
                </div>
                <!-- Center Floating Icon -->
                <div class="relative -top-6">
                    <div class="bg-emerald-600 rounded-full p-4 shadow-lg border-4 border-gray-100 cursor-pointer">
                         <i data-lucide="book-open" class="text-white w-6 h-6"></i>
                    </div>
                </div>
                <div class="flex flex-col items-center cursor-pointer text-gray-400 hover:text-emerald-600">
                    <i data-lucide="file-text" class="w-5 h-5"></i>
                    <span class="text-[10px] mt-1 font-medium">Artikel</span>
                </div>
                <div class="flex flex-col items-center cursor-pointer text-gray-400 hover:text-emerald-600">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                    <span class="text-[10px] mt-1 font-medium">Lainnya</span>
                </div>
            </nav>
        </div>

        <!-- ================= VIEW: TASBIH DIGITAL ================= -->
        <div id="view-tasbih" class="view-section flex-col h-screen bg-emerald-50 w-full hidden">
            <div class="bg-emerald-700 text-white p-4 flex items-center shadow-md">
                <button onclick="switchView('view-home')"><i data-lucide="arrow-left" class="w-6 h-6"></i></button>
                <h2 class="ml-4 text-lg font-bold">Tasbih Digital</h2>
            </div>
            <div class="flex-1 flex flex-col items-center justify-center p-6 pb-20">
                <div class="bg-white rounded-full h-64 w-64 flex items-center justify-center shadow-2xl border-8 border-emerald-100 mb-8 relative">
                    <div class="text-center">
                        <span class="block text-gray-500 text-sm mb-2">Target: 33</span>
                        <span id="tasbih-count" class="text-7xl font-bold text-emerald-600">0</span>
                    </div>
                </div>
                
                <button id="btn-tasbih-count" class="tasbih-btn w-full bg-emerald-600 text-white py-6 rounded-2xl text-xl font-bold shadow-lg transition select-none">
                    TEKAN
                </button>
                
                <button id="btn-tasbih-reset" class="mt-6 flex items-center text-gray-500 hover:text-emerald-600">
                    <i data-lucide="rotate-ccw" class="w-4 h-4 mr-2"></i> Reset
                </button>
            </div>
        </div>

        <!-- ================= VIEW: AL-QURAN ================= -->
        <div id="view-quran" class="view-section flex-col h-screen bg-gray-50 w-full hidden">
            <div class="bg-emerald-700 text-white p-4 flex items-center shadow-md sticky top-0 z-10">
                <button onclick="switchView('view-home')"><i data-lucide="arrow-left" class="w-6 h-6"></i></button>
                <h2 class="ml-4 text-lg font-bold">Al-Qur'an</h2>
                <div class="ml-auto"><i data-lucide="search" class="w-5 h-5"></i></div>
            </div>
            <div id="quran-list" class="p-4 space-y-3 overflow-y-auto pb-24 no-scrollbar">
                <!-- Diisi oleh JS -->
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- 1. DATA MOCKUP ---
        const PRAYER_TIMES = {
            Imsak: "04:08", Subuh: "04:18", Terbit: "05:35", Dhuha: "05:58",
            Dzuhur: "11:51", Ashar: "15:13", Maghrib: "18:02", Isya: "19:15"
        };

        const SURAH_LIST = [
            { number: 1, name: "Al-Fatihah", meaning: "Pembukaan", ayat: 7 },
            { number: 2, name: "Al-Baqarah", meaning: "Sapi Betina", ayat: 286 },
            { number: 3, name: "Ali 'Imran", meaning: "Keluarga Imran", ayat: 200 },
            { number: 4, name: "An-Nisa'", meaning: "Wanita", ayat: 176 },
            { number: 36, name: "Ya Sin", meaning: "Ya Sin", ayat: 83 },
            { number: 67, name: "Al-Mulk", meaning: "Kerajaan", ayat: 30 },
            { number: 18, name: "Al-Kahfi", meaning: "Gua", ayat: 110 },
        ];

        const ARTICLES = [
            { id: 1, cat: "Nasional", title: "PBNU Gelar Peringatan Hari Santri Nasional 2024", img: "https://placehold.co/600x400/047857/ffffff?text=Hari+Santri", date: "2 Jam yang lalu" },
            { id: 2, cat: "Syariah", title: "Hukum Membaca Doa Qunut Saat Sholat Subuh", img: "https://placehold.co/600x400/047857/ffffff?text=Fiqih", date: "4 Jam yang lalu" },
            { id: 3, cat: "Ubudiyah", title: "Tata Cara Ziarah Kubur Sesuai Sunnah", img: "https://placehold.co/600x400/047857/ffffff?text=Ziarah", date: "1 Hari yang lalu" }
        ];

        // --- 2. FUNGSI VIEW & NAVIGASI ---
        function switchView(viewId) {
            // Sembunyikan semua section
            document.querySelectorAll('.view-section').forEach(el => {
                el.classList.remove('active');
                el.classList.add('hidden');
            });
            // Tampilkan section yang dipilih
            const target = document.getElementById(viewId);
            target.classList.remove('hidden');
            target.classList.add('active');
            
            // Re-render icons jika perlu (kadang diperlukan saat elemen muncul dari hidden)
            lucide.createIcons();
            
            // Scroll ke atas
            window.scrollTo(0,0);
        }

        // --- 3. FUNGSI RENDER KONTEN ---
        function renderContent() {
            // Render Jadwal Mini di Header
            const prayerContainer = document.getElementById('prayer-mini-list');
            const relevantPrayers = ['Imsak', 'Subuh', 'Dzuhur', 'Ashar', 'Maghrib', 'Isya'];
            
            prayerContainer.innerHTML = relevantPrayers.slice(0, 4).map(key => `
                <div class="flex flex-col items-center">
                    <span class="${key === 'Dzuhur' ? 'font-bold text-white' : ''}">${key}</span>
                    <span>${PRAYER_TIMES[key]}</span>
                </div>
            `).join('');

            // Render Artikel
            const articleContainer = document.getElementById('article-list');
            articleContainer.innerHTML = ARTICLES.map(art => `
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex h-28 cursor-pointer">
                    <img src="${art.img}" alt="News" class="w-28 h-full object-cover">
                    <div class="p-3 flex flex-col justify-between flex-1">
                        <div>
                            <span class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full mb-1 inline-block">${art.cat}</span>
                            <h3 class="text-sm font-bold text-gray-800 line-clamp-2 leading-snug">${art.title}</h3>
                        </div>
                        <div class="flex justify-between items-center mt-2">
                            <span class="text-[10px] text-gray-400">${art.date}</span>
                            <i data-lucide="share-2" class="w-3 h-3 text-gray-400"></i>
                        </div>
                    </div>
                </div>
            `).join('');

            // Render List Al-Quran
            const quranContainer = document.getElementById('quran-list');
            quranContainer.innerHTML = SURAH_LIST.map(surah => `
                <div class="bg-white p-4 rounded-xl shadow-sm flex items-center border border-gray-100 hover:bg-emerald-50 cursor-pointer transition">
                    <div class="h-10 w-10 relative flex items-center justify-center mr-4">
                        <div class="absolute inset-0 border-2 border-emerald-200 rotate-45 rounded-sm"></div>
                        <span class="relative font-bold text-emerald-700 text-sm">${surah.number}</span>
                    </div>
                    <div class="flex-1">
                        <h3 class="font-bold text-gray-800">${surah.name}</h3>
                        <p class="text-xs text-gray-500">${surah.meaning} • ${surah.ayat} Ayat</p>
                    </div>
                    <div class="text-right">
                        <span class="text-xl font-arabic text-gray-800">Start</span> 
                    </div>
                </div>
            `).join('');
            
            // Inisialisasi Icon
            lucide.createIcons();
        }

        // --- 4. LOGIKA TASBIH ---
        let tasbihCount = 0;
        const displayCount = document.getElementById('tasbih-count');
        const btnCount = document.getElementById('btn-tasbih-count');
        const btnReset = document.getElementById('btn-tasbih-reset');

        btnCount.addEventListener('click', () => {
            tasbihCount++;
            displayCount.textContent = tasbihCount;
            // Getar HP jika didukung (haptic feedback)
            if (navigator.vibrate) navigator.vibrate(30);
        });

        btnReset.addEventListener('click', () => {
            if(confirm('Reset hitungan?')) {
                tasbihCount = 0;
                displayCount.textContent = 0;
            }
        });

        // --- 5. LOGIKA JAM ---
        function updateClock() {
            const now = new Date();
            document.getElementById('clock-display').textContent = now.toLocaleTimeString('id-ID');
        }

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            renderContent();
            setInterval(updateClock, 1000);
            updateClock();
        });

    </script>
</body>
</html>
